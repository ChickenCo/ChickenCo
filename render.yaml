# One-click setup on Render (render.com): New > Blueprint > pick this repo.
# The starter plan plus a 1 GB disk is about $7.25/month. The disk keeps the database between deploys.
services:
  - type: web
    name: pick-sheets
    runtime: docker
    plan: starter
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: PUSH_CONTACT
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
