<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8461b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pick Sheets">
  <title>Pick Sheets</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>&#8592;</button>
    <h1 id="title">Trucks</h1>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">&#9776;<span class="dot" id="menuDot" hidden></span></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Camera scanner overlay -->
  <div class="scanner" id="scanner" hidden>
    <video id="scanVideo" playsinline muted autoplay></video>
    <div class="scan-frame" aria-hidden="true"><span class="scan-line"></span></div>
    <div class="scan-status" id="scanStatus">Line up the barcode inside the box</div>
    <div class="scan-actions">
      <button class="btn btn-light" id="scanManual">Type code</button>
      <button class="btn btn-light" id="scanClose">Done</button>
    </div>
  </div>

  <dialog id="modal"><form method="dialog" id="modalForm" novalidate></form></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/zxing/zxing-reader.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
