<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8461b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pick Sheets">
  <title>ChickenCo Pick Sheets</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>&#8592;</button>
    <h1 id="title">Pick Sheets</h1>
    <a class="topbar-link" id="adminLink" href="#/admin">Admin</a>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Camera scanner overlay -->
  <div class="scanner" id="scanner" hidden>
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame" aria-hidden="true"></div>
    <div class="scan-status" id="scanStatus">Point the camera at a QR code</div>
    <div class="scan-actions">
      <button class="btn btn-light" id="scanManual">Type SKU</button>
      <button class="btn btn-light" id="scanClose">Done</button>
    </div>
  </div>

  <!-- Reusable modal dialog -->
  <dialog id="modal"><form method="dialog" id="modalForm" novalidate></form></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jsQR.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="js/store.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
